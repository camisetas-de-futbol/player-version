<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYER VERSION — Selecciona Categoría</title>
<meta name="description" content="Elige la competición para ver el catálogo de camisetas de edición de jugador. Trato en mano en Écija.">
<link rel="icon" type="image/png" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
  .categorias-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    min-height: calc(100vh - 120px);
    align-items: center;
  }

  .categoria-card {
    position: relative;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 30px;
    text-decoration: none;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  /* Capa oscura semitransparente para que el texto resalte siempre perfectamente */
  .categoria-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 15%, rgba(0,0,0,0.3) 85%);
    z-index: 1;
  }

  .categoria-card > * {
    position: relative;
    z-index: 2;
  }

  .categoria-card:hover {
    transform: translateY(-5px);
    border-color: #ff2a2a;
    box-shadow: 0 10px 30px rgba(255, 42, 42, 0.2);
  }

  .categoria-title {
    font-family: 'Anton', sans-serif;
    font-size: 2.2rem;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 1px;
  }

  .categoria-sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: #ff2a2a;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* Fondos específicos por tarjeta (Asegúrate de que los nombres coinciden exactamente con tu carpeta assets) */
  #card-mundial {
    background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('assets/fondo-mundial.png');
  }
  #card-laliga {
    background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('assets/fondo_laliga.png');
  }
  #card-premier {
    background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('assets/fondo_premier.png');
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Logo Player Version">
      <span class="brand-text">PLAYER<span>.VERSION</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html" style="color: #ff2a2a; font-weight: 600;">Catálogo</a>
    </div>
  </nav>
</header>

<main>
  <div class="categorias-container">
    
    <!-- MUNDIAL -->
    <a href="mundial.html" class="categoria-card" id="card-mundial">
      <div>
        <div class="categoria-sub">// EDICIÓN ESPECIAL</div>
        <div class="categoria-title">Mundial 26/27</div>
      </div>
    </a>

    <!-- LA LIGA -->
    <a href="laliga.html" class="categoria-card" id="card-laliga">
      <div>
        <div class="categoria-sub">// NACIONAL</div>
        <div class="categoria-title">La Liga</div>
      </div>
    </a>

    <!-- PREMIER LEAGUE -->
    <a href="premier.html" class="categoria-card" id="card-premier">
      <div>
        <div class="categoria-sub">// INTERNACIONAL</div>
        <div class="categoria-title">Premier League</div>
      </div>
    </a>

  </div>
</main>

</body>
</html>
